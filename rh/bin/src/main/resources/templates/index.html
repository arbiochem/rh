<!DOCTYPE html>

<html
        lang="fr"
        xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        RH - Tableau de bord
    </title>

    <link
            rel="stylesheet"
            href="/style.css">

</head>


<body>


<nav
        th:replace="~{fragments :: nav}">
</nav>


<div class="container">

    <h1>
        Tableau de bord
    </h1>


    <div class="card">

        <h2>
            Pointage du jour
        </h2>


        <p
                class="muted"
                th:text="${today}">
        </p>


        <table>

            <thead>

            <tr>

                <th>
                    Matricule
                </th>

                <th>
                    Agent
                </th>

                <th>
                    Site / Lieu
                </th>

                <th>
                    Heure début
                </th>

                <th>
                    Heure fin
                </th>

            </tr>

            </thead>


            <tbody>

            <tr
                    th:each="r : ${rows}">

                <td
                        th:text="${r.matricule}">
                </td>

                <td
                        th:text="${r.agent}">
                </td>

                <td
                        th:text="${r.site}">
                </td>

                <td
                        th:text="${r.heure_debut}">
                </td>

                <td
                        th:text="${r.heure_fin}">
                </td>

            </tr>


            <tr
                    th:if="${#lists.isEmpty(rows)}">

                <td
                        colspan="5">

                    Aucun pointage aujourd'hui.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


</body>

</html>
