<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Équipes — Administration RH</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f8fa; }
        .badge-chef { background-color: #6f42c1; }
        .card-equipe { transition: box-shadow .15s ease-in-out; }
        .card-equipe:hover { box-shadow: 0 .25rem .75rem rgba(0,0,0,.08); }
    </style>
</head>
<body>

<!-- ATTENTION : ajuste le chemin ci-dessous si ton fragment nav n'est pas dans
     templates/fragments/nav.html (ex: fragments/navbar, layout/nav, etc.) -->
<div th:replace="~{fragments :: nav}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Gestion des équipes</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/admin/equipes/archivees}">Équipes désactivées</a>
            <a class="btn btn-primary" th:href="@{/admin/equipes/nouveau}">+ Nouvelle équipe</a>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

    <div th:if="${#lists.isEmpty(equipes)}" class="alert alert-secondary">
        Aucune équipe pour le moment.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-3">
        <div class="col" th:each="equipe : ${equipes}">
            <div class="card card-equipe h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${equipe.nom}">Nom équipe</h5>
                    <p class="card-text text-muted" th:text="${equipe.description}">Description</p>
                </div>
                <div class="card-footer bg-white border-0 d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/admin/equipes/{id}(id=${equipe.id})}">Voir</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/admin/equipes/{id}/modifier(id=${equipe.id})}">Modifier</a>
                    <form th:action="@{/admin/equipes/{id}/supprimer(id=${equipe.id})}" method="post"
                          onsubmit="return confirm('Désactiver cette équipe ?');" class="ms-auto">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Désactiver</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
