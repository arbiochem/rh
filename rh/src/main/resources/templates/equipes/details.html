<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${equipe.nom}">Équipe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-chef { background-color: #6f42c1; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-1">
        <h1 class="h3 mb-0" th:text="${equipe.nom}">Nom équipe</h1>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/equipes}">← Retour à la liste</a>
    </div>
    <p class="text-muted" th:text="${equipe.description}">Description</p>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

    <div class="row g-4 mt-2">

        <div class="col-lg-7">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Membres <span class="badge bg-secondary" th:text="${#lists.size(membres)}">0</span></span>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        th:each="membre : ${membres}">
                        <div>
                            <div th:text="${membre.nomUtilisateur}">Nom</div>
                            <small class="text-muted" th:text="${membre.emailUtilisateur}">email@exemple.mg</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge"
                                  th:classappend="${membre.roleEquipe.name() == 'CHEF'} ? 'badge-chef text-white' : 'bg-light text-dark'"
                                  th:text="${membre.roleEquipe}">MEMBRE</span>

                            <form th:action="@{/admin/equipes/{id}/membres/{userId}/role(id=${equipe.id}, userId=${membre.utilisateurId})}"
                                  method="post" class="d-inline">
                                <input type="hidden" name="role"
                                       th:value="${membre.roleEquipe.name() == 'CHEF'} ? 'MEMBRE' : 'CHEF'">
                                <button type="submit" class="btn btn-sm btn-outline-secondary"
                                        th:text="${membre.roleEquipe.name() == 'CHEF'} ? 'Rétrograder' : 'Nommer chef'">
                                </button>
                            </form>

                            <form th:action="@{/admin/equipes/{id}/membres/{userId}/retirer(id=${equipe.id}, userId=${membre.utilisateurId})}"
                                  method="post" onsubmit="return confirm('Retirer ce membre de l\'équipe ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">✕</button>
                            </form>
                        </div>
                    </li>
                    <li class="list-group-item text-muted" th:if="${#lists.isEmpty(membres)}">
                        Aucun membre dans cette équipe.
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card card-body">
                <h2 class="h6">Ajouter un membre</h2>
                <form th:action="@{/admin/equipes/{id}/membres(id=${equipe.id})}" method="post">
                    <div class="mb-2">
                        <label class="form-label" for="utilisateurId">Agent</label>
                        <select class="form-select" id="utilisateurId" name="utilisateurId" required>
                            <option value="">-- Choisir un agent --</option>
                            <option
                                th:each="agent : ${agents}"
                                th:value="${agent.id}"
                                th:text="${agent.matricule + ' | ' + agent.telephone + ' | ' + agent.nom + ' ' + agent.prenom}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="role">Rôle dans l'équipe</label>
                        <select class="form-select" id="role" name="role">
                            <option value="MEMBRE">Membre</option>
                            <option value="CHEF">Chef d'équipe</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ajouter</button>
                </form>
            </div>
        </div>

    </div>
</div>
</body>
</html>
