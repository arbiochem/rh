<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${equipe.id} != null ? 'Modifier équipe' : 'Nouvelle équipe'">Formulaire</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container mt-4" style="max-width: 560px;">

    <h1 class="h4 mb-4" th:text="${equipe.id} != null ? 'Modifier l\'équipe' : 'Nouvelle équipe'">Formulaire</h1>

    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

    <form th:action="${equipe.id} != null
                       ? @{/admin/equipes/{id}/modifier(id=${equipe.id})}
                       : @{/admin/equipes/nouveau}"
          method="post" class="card card-body">

        <div class="mb-3">
            <label class="form-label" for="nom">Nom de l'équipe</label>
            <input class="form-control" id="nom" name="nom" th:value="${equipe.nom}" required maxlength="120">
        </div>

        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"
                      th:text="${equipe.description}"></textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-link" th:href="@{/admin/equipes}">Annuler</a>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
    </form>

</div>
</body>
</html>
