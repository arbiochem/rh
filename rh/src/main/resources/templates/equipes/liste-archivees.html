<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Équipes désactivées — Administration RH</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f8fa; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Équipes désactivées</h1>
        <a class="btn btn-outline-secondary" th:href="@{/admin/equipes}">← Retour à la liste</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

    <div th:if="${#lists.isEmpty(equipes)}" class="alert alert-secondary">
        Aucune équipe désactivée.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-3">
        <div class="col" th:each="equipe : ${equipes}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${equipe.nom}">Nom équipe</h5>
                    <p class="card-text text-muted" th:text="${equipe.description}">Description</p>
                </div>
                <div class="card-footer bg-white border-0">
                    <form th:action="@{/admin/equipes/{id}/reactiver(id=${equipe.id})}" method="post"
                          onsubmit="return confirm('Réactiver cette équipe ?');">
                        <button type="submit" class="btn btn-sm btn-outline-success w-100">↺ Réactiver</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
