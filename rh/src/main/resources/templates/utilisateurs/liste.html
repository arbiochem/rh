<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Utilisateurs — Administration RH</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Comptes utilisateurs</h1>
        <a class="btn btn-primary" th:href="@{/admin/utilisateurs/nouveau}">+ Nouvel utilisateur</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

    <table class="table table-hover bg-white">
        <thead>
            <tr>
                <th>Nom d'utilisateur</th>
                <th>Rôle</th>
                <th>Statut</th>
                <th class="text-end">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${utilisateurs}">
                <td th:text="${u.username}">username</td>
                <td>
                    <form th:action="@{/admin/utilisateurs/{id}/role(id=${u.id})}" method="post" class="d-flex gap-2">
                        <select class="form-select form-select-sm" name="role" style="width:auto">
                            <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option>
                            <option value="USER" th:selected="${u.role == 'USER'}">USER</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Mettre à jour</button>
                    </form>
                </td>
                <td>
                    <span class="badge" th:classappend="${u.actif} ? 'bg-success' : 'bg-secondary'"
                          th:text="${u.actif} ? 'Actif' : 'Désactivé'">Statut</span>
                </td>
                <td class="text-end">
                    <div class="d-flex gap-2 justify-content-end flex-wrap">
                        <form th:action="@{/admin/utilisateurs/{id}/mot-de-passe(id=${u.id})}" method="post"
                              class="d-flex gap-1"
                              onsubmit="return confirm('Changer le mot de passe de cet utilisateur ?');">
                            <input type="password" name="nouveauMotDePasse" class="form-control form-control-sm"
                                   placeholder="Nouveau mot de passe" required style="width:150px">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">🔑</button>
                        </form>
                        <form th:if="${u.actif}" th:action="@{/admin/utilisateurs/{id}/desactiver(id=${u.id})}"
                              method="post" onsubmit="return confirm('Désactiver ce compte ?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Désactiver</button>
                        </form>
                        <form th:unless="${u.actif}" th:action="@{/admin/utilisateurs/{id}/reactiver(id=${u.id})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-outline-success">Réactiver</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</body>
</html>
