<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvel utilisateur — Administration RH</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container mt-4" style="max-width: 500px;">

    <h1 class="h3 mb-4">Nouvel utilisateur</h1>

    <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

    <form th:action="@{/admin/utilisateurs/nouveau}" method="post" class="card card-body">
        <div class="mb-3">
            <label class="form-label" for="username">Nom d'utilisateur</label>
            <input class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Mot de passe</label>
            <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="agentId">Lier à un agent (optionnel)</label>
            <select class="form-select" id="agentId" name="agentId" required>
                <option value="">-- Aucun agent lié --</option>
                <option th:each="agent : ${agents}"
                        th:value="${agent.id}"
                        th:text="${agent.nom} + ' ' + ${agent.prenom} + ' (' + ${agent.matricule} + ')'">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="role">Rôle</label>
            <select class="form-select" id="role" name="role">
                <option value="USER">Utilisateur</option>
                <option value="ADMIN">Administrateur</option>
            </select>
        </div>
        <div class="d-flex justify-content-between">
            <a th:href="@{/admin/utilisateurs}" class="btn btn-outline-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary">Créer</button>
        </div>
    </form>

</div>
</body>
</html>
