<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RH - Agents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Agents</h3>
        <a class="btn btn-primary" th:href="@{/agents/nouveau}">+ Enregistrer un agent</a>
    </div>

    <div class="card p-3">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Matricule</th><th>Nom</th><th>Prenom</th><th>Poste</th>
                <th>Telephone</th><th>Email</th><th>Actif</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="agent : ${agents}">
                <td th:text="${agent.matricule}"></td>
                <td th:text="${agent.nom}"></td>
                <td th:text="${agent.prenom}"></td>
                <td th:text="${agent.poste}"></td>
                <td th:text="${agent.telephone}"></td>
                <td th:text="${agent.email}"></td>
                <td>
                    <span th:if="${agent.actif}" class="badge bg-success">Oui</span>
                    <span th:unless="${agent.actif}" class="badge bg-secondary">Non</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/agents/{id}/modifier(id=${agent.id})}">Modifier</a>
                    <form th:action="@{/agents/{id}/supprimer(id=${agent.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer cet agent ?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(agents)}">
                <td colspan="8" class="text-center text-muted">Aucun agent enregistre</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
