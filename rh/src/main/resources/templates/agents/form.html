<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RH - Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4">
    <h3 class="mb-4" th:text="${agent.id} != null ? 'Modifier un agent' : 'Enregistrer un agent'"></h3>

    <div class="card p-4" style="max-width:600px;">
        <form th:action="@{/agents/enregistrer}" th:object="${agent}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Matricule</label>
                <input type="text" th:field="*{matricule}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Nom *</label>
                <input type="text" th:field="*{nom}" class="form-control" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Prenom *</label>
                <input type="text" th:field="*{prenom}" class="form-control" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Poste</label>
                <input type="text" th:field="*{poste}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Telephone</label>
                <input type="text" th:field="*{telephone}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control">
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{actif}" class="form-check-input">
                <label class="form-check-label">Actif</label>
            </div>

            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/agents}" class="btn btn-outline-secondary">Annuler</a>
        </form>
    </div>
</div>
</body>
</html>
