<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RH - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div class="card login-card shadow-sm">
    <div class="card-body p-4">
        <h3 class="text-center mb-4">RH</h3>
        <p class="text-center text-muted mb-4">Connectez-vous a votre espace</p>

        <div th:if="${param.erreur}" class="alert alert-danger">Identifiants incorrects.</div>
        <div th:if="${param.deconnexion}" class="alert alert-success">Vous avez ete deconnecte.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>
        <p class="text-muted text-center mt-3 small">admin / admin123 (a modifier)</p>
    </div>
</div>
</body>
</html>
