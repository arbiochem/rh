<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RH - Sites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Sites</h3>
        <a class="btn btn-primary" th:href="@{/sites/nouveau}">+ Ajouter un site</a>
    </div>

    <div class="card p-3">
        <table class="table table-striped">
            <thead><tr><th>Nom</th><th>Adresse</th><th></th></tr></thead>
            <tbody>
            <tr th:each="site : ${sites}">
                <td th:text="${site.nom}"></td>
                <td th:text="${site.adresse}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/sites/{id}/modifier(id=${site.id})}">Modifier</a>
                    <form th:action="@{/sites/{id}/supprimer(id=${site.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer ce site ?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(sites)}">
                <td colspan="3" class="text-center text-muted">Aucun site enregistre</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
