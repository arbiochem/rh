<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RH - Site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4">
    <h3 class="mb-4" th:text="${site.id} != null ? 'Modifier un site' : 'Ajouter un site'"></h3>

    <div class="card p-4" style="max-width:600px;">
        <form th:action="@{/sites/enregistrer}" th:object="${site}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Nom du site *</label>
                <input type="text" th:field="*{nom}" class="form-control" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Adresse</label>
                <input type="text" th:field="*{adresse}" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/sites}" class="btn btn-outline-secondary">Annuler</a>
        </form>
    </div>
</div>
</body>
</html>
