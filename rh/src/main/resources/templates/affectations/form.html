<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RH - Nouvelle affectation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4">
    <h3 class="mb-4">Nouvelle affectation journaliere</h3>

    <div class="card p-4" style="max-width:700px;">
        <form th:action="@{/affectations/enregistrer}" method="post">

            <div class="mb-3">
                <label class="form-label">Agent *</label>
                <select name="agentId" class="form-select" required>
                    <option value="" disabled selected>-- Choisir un agent --</option>
                    <option th:each="agent : ${agents}" th:value="${agent.id}"
                            th:text="${agent.nomComplet + (agent.poste != null ? ' - ' + agent.poste : '')}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Date *</label>
                <input type="date" name="dateAffectation" class="form-control" th:value="${aujourdHui}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Site(s)</label>
                <select name="siteIds" class="form-select" multiple size="5">
                    <option th:each="site : ${sites}" th:value="${site.id}" th:text="${site.nom}"></option>
                </select>
                <div class="form-text">Maintenez Ctrl (ou Cmd) pour selectionner plusieurs sites. Une affectation sera creee pour chaque site coche.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Autre lieu (facultatif)</label>
                <input type="text" name="lieuLibre" class="form-control" placeholder="Ex. : Mission client a Toamasina">
                <div class="form-text">A utiliser si le lieu ne figure pas dans la liste des sites.</div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Heure de debut</label>
                    <input type="time" name="heureDebut" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Heure de fin</label>
                    <input type="time" name="heureFin" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Statut</label>
                <select name="statut" class="form-select">
                    <option value="PLANIFIE" selected>Planifie</option>
                    <option value="CONFIRME">Confirme</option>
                    <option value="TERMINE">Termine</option>
                    <option value="ANNULE">Annule</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Commentaire</label>
                <textarea name="commentaire" class="form-control" rows="2"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/affectations}" class="btn btn-outline-secondary">Annuler</a>
        </form>
    </div>
</div>
</body>
</html>
