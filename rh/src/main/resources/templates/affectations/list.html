<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RH - Affectations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Affectations journalieres</h3>
        <a class="btn btn-primary" th:href="@{/affectations/nouveau}">+ Nouvelle affectation</a>
    </div>

    <form th:action="@{/affectations}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-auto">
            <label class="form-label mb-0">Jour</label>
            <input type="date" name="date" class="form-control" th:value="${jour}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Afficher</button>
        </div>
    </form>

    <div class="card p-3">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Agent</th><th>Poste</th><th>Lieu / Site</th><th>Horaires</th>
                <th>Statut</th><th>Commentaire</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${affectations}">
                <td th:text="${a.agent.nomComplet}"></td>
                <td th:text="${a.agent.poste}"></td>
                <td th:text="${a.lieuAffiche}"></td>
                <td th:text="${(a.heureDebut ?: '-') + ' - ' + (a.heureFin ?: '-')}"></td>
                <td><span class="badge bg-secondary" th:text="${a.statut}"></span></td>
                <td th:text="${a.commentaire}"></td>
                <td class="text-end">
                    <form th:action="@{/affectations/{id}/supprimer(id=${a.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Supprimer cette affectation ?');">
                        <input type="hidden" name="date" th:value="${jour}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(affectations)}">
                <td colspan="7" class="text-center text-muted">Aucune affectation pour ce jour</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
