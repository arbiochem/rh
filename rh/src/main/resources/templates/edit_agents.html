<!DOCTYPE html>

<html
        lang="fr"
        xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        RH - Modifier un agent
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link
            rel="stylesheet"
            href="/style.css">

</head>


<body class="bg-light">

<nav
        th:replace="~{fragments :: nav}">
</nav>


<div class="container py-4">

    <h1 class="h3 fw-bold mb-4">
        <i class="bi bi-pencil-square me-2 text-primary"></i>
        Modifier un agent
    </h1>


    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <form
                    method="post"
                    th:action="@{'/agents/edit/' + ${agent.id}}"
                    th:object="${agent}">


                <div class="row g-3">


                    <div class="col-md-6 col-lg-4">

                        <label class="form-label">
                            Matricule
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{matricule}"
                                required>

                    </div>


                    <div class="col-md-6 col-lg-4">

                        <label class="form-label">
                            Nom
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{nom}"
                                required>

                    </div>


                    <div class="col-md-6 col-lg-4">

                        <label class="form-label">
                            Prénom
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{prenom}"
                                required>

                    </div>


                    <div class="col-md-6 col-lg-4">

                        <label class="form-label">
                            Téléphone
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{telephone}">

                    </div>


                    <div class="col-md-6 col-lg-4">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                                type="email"
                                class="form-control"
                                th:field="*{email}">

                    </div>


                </div>


                <div class="mt-4 d-flex gap-2">

                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check-lg me-1"></i>
                        Enregistrer
                    </button>

                    <a href="/agents" class="btn btn-outline-secondary px-4">
                        Annuler
                    </a>

                </div>


            </form>

        </div>

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
