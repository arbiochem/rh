spring.application.name=RH

# ------------------------------------------------------------------
# Connexion a la base Turso (libSQL)
# L'URL Turso "libsql://rh-mahefa.aws-us-west-2.turso.io" doit etre
# convertie au format JDBC attendu par le pilote dbeaver-jdbc-libsql :
#   jdbc:dbeaver:libsql:https://<host>
# Le token d'authentification Turso est fourni comme mot de passe
# (laisser le nom d'utilisateur vide) et NE DOIT PAS etre committe :
# fournissez-le via la variable d'environnement TURSO_AUTH_TOKEN.
# ------------------------------------------------------------------
spring.datasource.driver-class-name=com.dbeaver.jdbc.driver.libsql.LibSqlDriver
spring.datasource.url=jdbc:dbeaver:libsql:https://rh-mahefa.aws-us-west-2.turso.io
spring.datasource.username=
